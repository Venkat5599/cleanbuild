name = "ratchet-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The autonomous path. Nothing here needs a request, a session, or a browser.
#   hourly  -> mature due experiments, update beliefs, brief the Mind
#   nightly -> refit baselines and rebuild every posterior with a full solve
[triggers]
crons = ["0 * * * *", "0 3 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ratchet"
# Filled in by `wrangler d1 create ratchet`.
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "../../packages/db/migrations"

[vars]
ALLOWED_ORIGINS = "http://localhost:3000"

# Optional: Cloudflare Analytics Engine sink for structured events.
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "ratchet_events"

# Secrets are set with `wrangler secret put NAME`, never committed:
#   MINDS_BUILDER_API_KEY        Builder API JWT from build.hellominds.ai
#   MINDS_ALIAS                  conversation alias the worker messages
#   TELEGRAM_BOT_TOKEN           fallback delivery channel
#   TELEGRAM_CHAT_ID
#   UPSTASH_REDIS_REST_URL       cron lock and metric counters
#   UPSTASH_REDIS_REST_TOKEN
#   OTEL_EXPORTER_OTLP_ENDPOINT  e.g. https://collector.example.com/v1/traces
#   OTEL_EXPORTER_OTLP_HEADERS   e.g. "authorization=Bearer xxx"
#   METRICS_TOKEN                bearer required to scrape /metrics
